[project]
name = "scopepull"
version = "0.1.1"
description = "Gets the night off your smart scope: Unistellar Odyssey Pro, ZWO Seestar"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kyle Fox Austin" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
    "astropy>=6.0",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "numpy>=1.26",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Repository = "https://github.com/kylefoxaustin/scopepull"

[project.scripts]
scopepull = "scopepull.cli:app"
# The owl. Stdlib tkinter only, so no extra dependency buys it.
scopepull-gui = "scopepull.gui:main"

[project.optional-dependencies]
tui = ["textual>=0.60"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "fastapi>=0.111",
    "ruff>=0.5",
    "mypy>=1.10",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopepull"]
# The owl's faces and icons travel with the package (and into the exe).
artifacts = ["src/scopepull/assets/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires a real telescope at 192.168.100.1"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
# The window, lifted from starstack: os.path throughout (PTH), broad excepts
# around every optional dependency and every tk call that may not exist on a
# given box (B), and tkinter's own idioms (SIM). Rewriting it to this repo's
# house style would mean re-debugging it.
"src/scopepull/gui.py" = ["PTH", "B", "SIM", "E501"]

[tool.mypy]
python_version = "3.12"  # numpy's bundled stubs use 3.12 `type` statements
strict = true
files = ["src"]
# gui.py is a tkinter window lifted wholesale from starstack (see its header).
# Annotating 1,100 lines of widget code would churn every line of a file whose
# value is that it has already been debugged in front of users; tkinter's own
# stubs make strict mode noisy for no safety. The CLI underneath it is typed.
exclude = ['src/scopepull/gui\.py$']

[[tool.mypy.overrides]]
# Scientific libs ship without type stubs / py.typed markers.
module = ["astropy.*", "tifffile.*", "imagecodecs.*"]
ignore_missing_imports = true
