[project]
name = "scopepull"
version = "0.1.2"
description = "One-shot stack puller for Unistellar Odyssey Pro telescopes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kyle Fox Austin" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
    "astropy>=6.0",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "numpy>=1.26",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Repository = "https://github.com/kylefoxaustin/scopepull"

[project.scripts]
scopepull = "scopepull.cli:app"

[project.optional-dependencies]
tui = ["textual>=0.60"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "fastapi>=0.111",
    "ruff>=0.5",
    "mypy>=1.10",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopepull"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires a real telescope at 192.168.100.1"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.mypy]
python_version = "3.12"  # numpy's bundled stubs use 3.12 `type` statements
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Scientific libs ship without type stubs / py.typed markers.
module = ["astropy.*", "tifffile.*", "imagecodecs.*"]
ignore_missing_imports = true
