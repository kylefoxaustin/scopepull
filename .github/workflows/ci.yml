name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python }}
      - name: Sync
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -v
